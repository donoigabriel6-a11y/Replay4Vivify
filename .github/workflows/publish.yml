name: Publish

env:
  module_id: replay4vivify
  qmodName: Replay4Vivify

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: 'Version to release (v will be added to the tag)'
        required: true
      release_msg:
        description: 'Message for release'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        name: Checkout
        with:
          submodules: true
          lfs: true

      - uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Create ndkpath.txt
        run: |
          echo "$ANDROID_NDK_LATEST_HOME" > ${GITHUB_WORKSPACE}/ndkpath.txt
          cat ${GITHUB_WORKSPACE}/ndkpath.txt

      - name: QPM Action
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}

          restore: true
          resolve_ndk: true
          cache: true

      - name: List Post Restore
        run: |
          echo includes:
          ls -la ${GITHUB_WORKSPACE}/extern/includes
          echo libs:
          ls -la ${GITHUB_WORKSPACE}/extern/libs

      - name: Build & create qmod
        run: |
          cd ${GITHUB_WORKSPACE}
          qpm s qmod

      - name: Get Library Name
        id: libname
        run: |
          cd ./build/
          pattern="lib${module_id}*.so"
          files=( $pattern )
          echo "NAME=${files[0]}" >> $GITHUB_OUTPUT

      - name: Prepare debug library
        run: |
          # Debug lib is moved to ./build/debug/ by CMake POST_BUILD commands
          # Release lib stays in ./build/
          # We need to rename debug lib to debug_<name> for upload
          if [ -f "./build/debug/${{ steps.libname.outputs.NAME }}" ]; then
            mv "./build/debug/${{ steps.libname.outputs.NAME }}" "./build/debug/debug_${{ steps.libname.outputs.NAME }}"
          elif [ -f "./build/${{ steps.libname.outputs.NAME }}" ]; then
            # If not in debug folder, copy from build folder
            cp "./build/${{ steps.libname.outputs.NAME }}" "./build/debug/debug_${{ steps.libname.outputs.NAME }}"
          else
            echo "Debug library not found!"
            ls -la ./build/
            ls -la ./build/debug/ 2>/dev/null || echo "debug folder not found"
            exit 1
          fi

      - name: Upload to Release
        id: upload_file_release
        uses: softprops/action-gh-release@v0.1.12
        with:
          name: ${{ github.event.inputs.release_msg }}
          tag_name: "v${{ github.event.inputs.release_ver }}"
          files: |
            ./build/${{ steps.libname.outputs.NAME }}
            ./build/debug/debug_${{ steps.libname.outputs.NAME }}
            ./${{ env.qmodName }}.qmod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
